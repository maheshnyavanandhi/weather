<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="weather-card">
    <div class="search-box">
      <input type="text" placeholder="Enter city name" spellcheck="false">
      <button><img src="images/sun.png" alt="Search"></button>
    </div>

    <div class="weather">
      <img src="images/cloud.png" class="weather-icon" alt="Weather condition">
      <h1 class="temp">--°c</h1>
      <h2 class="city">City Name</h2>
      <p class="condition">Condition</p>

      <div class="details">
        <div class="col">
          <img src="images/humidity.png" alt="Humidity">
          <div>
            <p class="humidity">--%</p>
            <span>Humidity</span>
          </div>
        </div>
        <div class="col">
          <img src="images/cloud.png" alt="Wind Speed">
          <div>
            <p class="wind">-- km/h</p>
            <span>Wind Speed</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
